buildDir = "dist"

tasks.register('clean') {
    dependsOn npmClean
}

tasks.register('installDist', Copy) {
    dependsOn npmBuild
    mustRunAfter ":manager:installDist"
    // getAppConfig from @openremote/util writes the production bundle to build/dist
    from "build/dist"
    into "${project(':deployment').buildDir}/image/manager/app/${projectDir.name}"
}
