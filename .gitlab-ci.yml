include:
  - component: $CI_SERVER_FQDN/iot-platform/ci-catalog/automatic-release/auto-release@v1.2.0
    inputs:
      proxy_auth: $PROXY_AUTH_WRITE
      proxy_auth2: $PROXY_AUTH_WRITE2
      versioning_stage: version
      release_stage: release

stages:
  - version
  - build
  - release

build:gradle:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - docker-internet
    - iot-internet
  variables:
    GIT_DEPTH: "0"
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - ./gradlew test --console=plain
    - ./gradlew installDist -x :ui:app:custom:installDist -x :ui:app:custom-react:installDist ${NEXT_VERSION:+-Prelease.forceVersion=$NEXT_VERSION} --console=plain
  artifacts:
    when: always
    reports:
      junit: test/build/test-results/test/TEST-*.xml
