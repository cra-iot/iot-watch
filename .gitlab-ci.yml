include:
  - component: $CI_SERVER_FQDN/iot-platform/ci-catalog/automatic-release/auto-release@~latest
    inputs:
      proxy_auth: $PROXY_AUTH_WRITE
      proxy_auth2: $PROXY_AUTH_WRITE2
      versioning_stage: version
      release_stage: release

stages:
  - version
  - build
  - build_ui
  - build_docker
  - release

variables:
  FLEET_APP_IMAGE: iot-watch/fleet-app

# CRA root CAs (same list and checksums as the CRA CI catalog), appended to the system bundle
.cra-ca:
  before_script:
    - |
      echo "https://$PROXY/repository/ca/CA.crt 1e13cb7e27bbc53901c9bbde46034994b840c2e2278fb854f0619dfed46d6cd2
      https://$PROXY/repository/ca/CRA-RootCA-2051.crt 95b1b5b9a65948ea2d157d85e93b724108e1519409f6c6fc54da6833aa33ce6c
      " | while read -r CA_URL CA_SHA256; do
        [ -n "$CA_URL" ] || continue
        CA_FILE=$(basename "$CA_URL")
        curl -fsSk -o "$CA_FILE" "$CA_URL" || exit 1
        echo "$CA_SHA256  $CA_FILE" | sha256sum -c - || exit 1
        { echo; cat "$CA_FILE"; } >> /etc/ssl/certs/ca-certificates.crt
      done

build:gradle:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - docker-internet
    - iot-internet
  variables:
    GIT_DEPTH: "0"
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .gradle/caches
      - .gradle/wrapper
  script:
    - ./gradlew test --console=plain
    - ./gradlew installDist -x :ui:app:fleet:installDist -x :ui:app:custom-react:installDist ${NEXT_VERSION:+-Prelease.forceVersion=$NEXT_VERSION} --console=plain
    # TypeScript model and REST client for build:fleet-app (generated from the Java model, not in git)
    - ./gradlew :ui:component:rest:generateTypeScript --console=plain
  artifacts:
    when: always
    expire_in: 1 days
    paths:
      - ui/component/model/src/model.ts
      - ui/component/model/src/typescript-generator-info.json
      - ui/component/rest/src/restclient.ts
    reports:
      junit: test/build/test-results/test/TEST-*.xml

# The IoT Watch manager app (ui/app/fleet): the manager UI with the fleet page, deployed to
# {customAppDocroot}/manager. Yarn comes from .yarn/releases (yarnPath), the image only needs Node;
# packages come from the Nexus npm proxy (the lockfile holds no registry URLs, so --immutable still applies).
build:fleet-app:
  stage: build_ui
  image: dockerhub.$PROXY/library/node:22
  tags:
    - docker
    - iot
  variables:
    NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    YARN_NPM_REGISTRY_SERVER: https://$PROXY/repository/npm/
    YARN_NPM_AUTH_IDENT: $PROXY_AUTH_WRITE2
    YARN_NPM_ALWAYS_AUTH: "true"
  needs:
    - job: build:gradle
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH'
  cache:
    key: yarn-$CI_COMMIT_REF_SLUG
    paths:
      - .yarn/cache
  before_script:
    - !reference [.cra-ca, before_script]
  script:
    - yarn install --immutable
    - yarn workspace model run build
    - yarn workspace rest run build
    - yarn workspace @openremote/fleet run build
    - mkdir -p fleet-app && cp -R ui/app/fleet/build/dist/. fleet-app/
  artifacts:
    expire_in: 1 days
    paths:
      - fleet-app/

# Content image for the Helm chart (or.custom.apps): the app under /app, copied by an init container.
# Same versioning as the go-microservice component: main pushes $NEXT_VERSION when auto-release
# decides a release, other branches always push <sha>-<branch>-<pipeline>.
build:fleet-app:image:
  stage: build_docker
  image: quay.$PROXY/containers/buildah:v1.40.1-immutable
  tags:
    - docker
    - iot
  # No needs: by stage order the job gets fleet-app/ and the auto-release dotenv (NEXT_VERSION, RELEASE_NEEDED)
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_REF_SLUG == "master" || $CI_COMMIT_REF_SLUG == "main"'
      variables:
        VERSION: '$NEXT_VERSION'
    - if: '$CI_COMMIT_BRANCH'
      variables:
        VERSION: "$CI_COMMIT_SHORT_SHA-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID"
        RELEASE_NEEDED: "true"
  variables:
    # vfs: buildah cannot stack overlayfs on the runner's overlayfs
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
  before_script:
    - !reference [.cra-ca, before_script]
  script:
    - |
      if [[ "${RELEASE_NEEDED}" != "true" ]]; then
        echo "No image to release skipping..."
        exit 0
      fi
      if [[ -z "${VERSION}" ]]; then
        echo "RELEASE_NEEDED=true but VERSION is empty. Check the auto-release version job." >&2
        exit 1
      fi
    - IMAGE_TAG="${FLEET_APP_IMAGE}:${VERSION}"
    - ctr=$(buildah from --creds=$PROXY_AUTH_WRITE dockerhub.$PROXY/library/alpine:3)
    - mnt=$(buildah mount "$ctr")
    - mkdir -p "$mnt/app"
    - cp -R fleet-app/. "$mnt/app/"
    - buildah umount "$ctr"
    - |
      buildah config \
        --workingdir /app \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.title=${IMAGE_TAG}" \
        --label "org.opencontainers.image.vendor=CRA" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.description=IoT Watch manager app (Helm or.custom.apps content image), built from ${CI_PROJECT_PATH} ${CI_COMMIT_REF_NAME}" \
        "$ctr"
    - buildah commit "$ctr" "$NEXUS_REGISTRY/$IMAGE_TAG"
    - printf '%s' "$NEXUS_REGISTRY_PASSWORD" | buildah login -u "$NEXUS_REGISTRY_USER" --password-stdin $NEXUS_REGISTRY
    - echo "Pushing image $NEXUS_REGISTRY/$IMAGE_TAG"
    - buildah push "$NEXUS_REGISTRY/$IMAGE_TAG"
    - buildah rm "$ctr"
    - buildah rmi "$NEXUS_REGISTRY/$IMAGE_TAG"
