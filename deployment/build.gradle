plugins {
    id 'java-library'
}

configurations {
    developmentRuntime
    managerRuntime
}

dependencies {
    api project(":setup")
    managerRuntime libs.openremote.manager
}

tasks.register('license') {
    doLast {
        def licenseFiles = new ArrayList<>()
        licenseFiles.add("${rootDir}/LICENSE.txt")

        def toConcatenate = files(licenseFiles.toArray())
        def outputFileName = "${buildDir}/image/manager/app/LICENSE.txt"
        def output = new File(outputFileName)
        if (output.exists()) {
            output.delete()
        }
        output.getParentFile().mkdirs()
        output.createNewFile()
        output.write('') // truncate output if needed
        toConcatenate.each { f -> output << f.text }
    }
}

// Keycloak loads themes packaged as a JAR from /opt/keycloak/providers, so the themes in
// keycloak/themes can be delivered to a Keycloak pod as a single file.
def keycloakThemesDir = file('keycloak/themes')

def keycloakThemeDescriptor = tasks.register('keycloakThemeDescriptor') {
    def descriptor = layout.buildDirectory.file('keycloak-theme/keycloak-themes.json')
    inputs.dir(keycloakThemesDir)
    outputs.file(descriptor)
    doLast {
        // Every theme directory, with every theme type (login, email, ...) it contains
        def themes = keycloakThemesDir.listFiles().findAll { it.directory }.sort { it.name }.collect { theme ->
            [name: theme.name, types: theme.listFiles().findAll { it.directory }*.name.sort()]
        }
        descriptor.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([themes: themes])) + '\n'
    }
}

tasks.register('keycloakThemeJar', Jar) {
    archiveFileName = 'cra-keycloak-theme.jar'
    destinationDirectory = layout.buildDirectory.dir('keycloak')
    from(keycloakThemeDescriptor) {
        into 'META-INF'
    }
    from(keycloakThemesDir) {
        into 'theme'
        exclude '*.md'
    }
}

tasks.register('installDist', Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn('keycloakThemeJar')
    dependsOn(parent.getTasksByName('installDist', true).findAll {
        // Don't create circular dependency
        it.project != project
    })

    into("$buildDir")

    from "Dockerfile"

    into("image") {
        from projectDir
        exclude "build.gradle", "**/build.gradle", "Dockerfile", "build", "**/*.mbtiles", "src", "**/*.md", ".gitignore", "**/*.encrypted"
    }

    into("image/manager/extensions") {
        from configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {it.file }
        // Don't include deps baked into the manager docker image
        exclude configurations.managerRuntime.resolvedConfiguration.resolvedArtifacts.collect {it.file.name }
        // Don't include deps used for dev purposes only
        exclude configurations.developmentRuntime.resolvedConfiguration.resolvedArtifacts.collect {it.file.name }
    }
}
