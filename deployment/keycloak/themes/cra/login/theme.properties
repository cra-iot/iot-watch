# CRA IoT Watch login theme. Only template.ftl is overridden; every page template
# comes from the Keycloak base theme and is styled through the classes below.
parent=base
import=common/keycloak
locales=en,cs

styles=css/styles.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=cra
kcBodyClass=cra-body
kcLoginClass=cra-page
kcFormCardClass=cra-card

kcFormClass=cra-form
kcFormGroupClass=cra-form-group
kcFormSettingClass=cra-form-settings
kcFormOptionsClass=cra-form-options
kcFormOptionsWrapperClass=cra-form-options__wrapper
kcFormButtonsClass=cra-form-buttons
kcLabelClass=cra-label
kcLabelWrapperClass=cra-label-wrapper
kcInputWrapperClass=cra-input-wrapper
kcInputClass=cra-input
kcInputGroup=cra-input-group
kcInputErrorMessageClass=cra-input-error
kcContentWrapperClass=cra-required-row
kcSignUpClass=cra-info

kcFormPasswordVisibilityButtonClass=cra-password-toggle
kcFormPasswordVisibilityIconShow=cra-icon cra-icon--eye
kcFormPasswordVisibilityIconHide=cra-icon cra-icon--eye-off

kcButtonClass=cra-btn
kcButtonPrimaryClass=cra-btn--primary
kcButtonDefaultClass=cra-btn--secondary
kcButtonBlockClass=cra-btn--block

kcAlertClass=cra-alert
kcAlertTitleClass=cra-alert__text
kcFeedbackSuccessIcon=cra-icon cra-icon--success
kcFeedbackWarningIcon=cra-icon cra-icon--warning
kcFeedbackErrorIcon=cra-icon cra-icon--error
kcFeedbackInfoIcon=cra-icon cra-icon--info
kcResetFlowIcon=cra-icon cra-icon--restart

kcLocaleMainClass=cra-locale
kcLocaleListClass=cra-locale__menu
kcLocaleItemClass=cra-locale__item

kcCheckInputClass=cra-check
kcRecoveryCodesWarning=cra-codes-warning
kcRecoveryCodesList=cra-codes
kcRecoveryCodesActions=cra-codes-actions
